# Prometheus 采集配置：抓取后端 Actuator 暴露的指标
global:
  scrape_interval: 15s
  # 告警规则的求值周期：与抓取周期一致，避免规则看到的是过期样本
  evaluation_interval: 15s

# 告警规则（结果见 Prometheus 的 /alerts 页面与 ALERTS 指标）
# 注意：规则在 Prometheus 内求值即可，但要真正发出通知还需接 Alertmanager —— 本项目未编排。
rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: geek-mall-server
    metrics_path: /actuator/prometheus
    static_configs:
      # 后端跑在宿主机（IDEA / mvn spring-boot:run）时用 host.docker.internal
      # 若后端也跑在容器里，改成容器服务名，如 geek-mall-server:8080
      - targets: ["host.docker.internal:8080"]
        labels:
          application: geek-mall-server
      # 多实例（infra/docker-compose.multi.yml）时改用下面这组 target，
      # 否则实例 2/3 的指标是看不见的：
      # - targets: ["host.docker.internal:8081", "host.docker.internal:8082", "host.docker.internal:8083"]
      #   labels:
      #     application: geek-mall-server

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
