name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

# 同一分支的旧流水线在新提交到达时自动取消，避免排队浪费额度
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ------------------------------------------------------------
  # 后端：格式检查（Spotless ratchet） + 编译 + 全量测试
  # 集成测试用 Testcontainers 自起真实 MySQL 8 / Redis 7，
  # GitHub 托管 runner 自带 Docker，无需额外起 docker-compose。
  # ------------------------------------------------------------
  backend:
    name: 后端 · 构建与测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          # Spotless 的 ratchetFrom=origin/main 要算「相对基线的改动文件」，
          # 依赖完整 git 历史；默认 fetch-depth: 1 的浅克隆里没有 origin/main，检查会直接报错。
          fetch-depth: 0

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # 单独成步只是为了在 Actions 页面上能一眼区分「格式挂了」还是「测试挂了」。
      # 它同样绑定在 validate 阶段，所以下面的 mvn test 也会跑一次（幂等且很快）。
      - name: 代码格式检查（Spotless ratchet · 只查相对 origin/main 改动的文件）
        run: mvn -B -ntp spotless:check

      - name: 运行测试
        run: mvn -B -ntp test

      # 测试失败时也上传，便于在 Actions 页面直接看用例明细
      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: backend/target/surefire-reports/
          if-no-files-found: ignore

  # ------------------------------------------------------------
  # 前端：两个子工程并行（ESLint + Prettier ratchet + vite build）
  # ------------------------------------------------------------
  frontend:
    name: 前端 · ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [ frontend, frontendMerchant ]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          # 格式 ratchet 以 origin/main 为基线算改动文件，同样需要完整历史
          fetch-depth: 0

      - name: 安装 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 静态检查（ESLint）
        run: npm run lint

      - name: 格式检查（Prettier ratchet · 只查本次改动的文件）
        # 脚本内部会 cd 到具体前端目录，因此这里要回到仓库根执行
        working-directory: ${{ github.workspace }}
        run: bash scripts/check-frontend-style.sh origin/main ${{ matrix.app }}

      - name: 构建
        run: npm run build
