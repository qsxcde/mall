# 依赖漏洞与版本更新扫描。
#
# 目标是「有安全补丁时拿得到通知」，而不是自动升级全库 —— 因此：
#   - 每周一次（避免每日 PR 噪音）
#   - minor/patch 归组为一个 PR，major 单独开（major 常有破坏性变更，需人工评估）
#   - 同时扫描 github-actions 本身，避免 actions 长期停留在旧版本
#   - 已人工评估、确认需要专门迁移的 major 版本用 ignore 排除，避免每周重复开 PR
version: 2

updates:
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
      - backend
    ignore:
      # Spring Boot：当前锁在 4.1.1（Spring Framework 7 / Security 7 / Jackson 3）。
      # 只在 4.1.x 的补丁级继续自动跟 —— 3.x → 4.x 的迁移已经完成（见
      # docs/planning 的升级记录），但 4.2/5.x 会再次带来 Jakarta/配置/依赖管理变更，
      # 需要连同 MyBatis-Plus starter、springdoc、jjwt 一起人工验证。
      - dependency-name: "org.springframework.boot:spring-boot-starter-parent"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      # logstash-logback-encoder 8 → 9：破坏性变更，影响 logback-spring.xml 的
      # JSON 输出格式与脱敏规则，升级后需重新验证结构化日志，实测测试失败
      - dependency-name: "net.logstash.logback:logstash-logback-encoder"
        update-types: ["version-update:semver-major"]
      # springdoc 2.x → 3.x：随 Spring Boot 4 的 API 变更
      - dependency-name: "org.springdoc:springdoc-openapi-starter-webmvc-ui"
        update-types: ["version-update:semver-major"]
      # MinIO 8.x → 9.x：客户端 API 重写
      - dependency-name: "io.minio:minio"
        update-types: ["version-update:semver-major"]
      # jjwt 0.12 → 0.13：0.x 阶段按 semver 视为 major，API 有破坏性调整
      - dependency-name: "io.jsonwebtoken:*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      # mybatis-plus：当前 3.5.17，走 spring-boot4-starter + 独立的 mybatis-plus-jsqlparser
      # 模块（3.5.9 起 PaginationInnerInterceptor 迁到了 jsqlparser 模块）。
      # 这条 ignore 是为了拦住「自动升到下一个大版本时又回到 boot3 starter」，
      # 4.x 需要人工确认 boot4 starter 是否仍独立发布。
      - dependency-name: "com.baomidou:mybatis-plus-spring-boot4-starter"
        update-types: ["version-update:semver-major"]
      - dependency-name: "com.baomidou:mybatis-plus-jsqlparser"
        update-types: ["version-update:semver-major"]
    groups:
      # 补丁与小版本合并成一个 PR：这类升级通常向后兼容，逐条开 PR 只会淹没评审
      maven-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
      - frontend
    ignore:
      # 当前 vite 7.3.7 / vue-router 4.5.x（两端一致）。
      # vite 8 与 vue-router 5 都是 major，需人工评估 Node 版本要求与插件 API 变更后再升
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vue-router"
        update-types: ["version-update:semver-major"]
      # 当前 pinia 2.3.x。2 → 4 跨两个 major，选项式 store 与 $reset 行为都有变更
      - dependency-name: "pinia"
        update-types: ["version-update:semver-major"]
      # jsdom 25 → 30 要求 Node ^22.22.2 || ^24.15.0 || >=26.0.0，
      # 而 CI（.github/workflows/ci.yml）仍用 Node 20 —— 升上去单测直接跑不起来。
      # 移除本条的前置条件：CI 的 node-version 先升到 22/24。
      - dependency-name: "jsdom"
        update-types: ["version-update:semver-major"]
      # 两端已统一在 eslint 10（此前 buyer=10 / merchant=9，flat config 行为不一致，
      # 同一份 .vue 在两端可能一边过一边挂）。11 及以上的 major 仍需人工评估
      # flat config 的插件兼容性；@eslint/js 与主包版本强绑定，必须一起忽略。
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
    groups:
      npm-frontend-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /frontendMerchant
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
      - frontend
    ignore:
      # 当前 vue-router 4.5.x；5.x 的路由 API 与守卫签名变更需人工评估
      - dependency-name: "vue-router"
        update-types: ["version-update:semver-major"]
      # 当前 vite 7.3.7；8.x 的 Node 版本要求与插件 API 变更需人工评估
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      # 当前 pinia 2.3.x；2 → 4 跨两个 major
      - dependency-name: "pinia"
        update-types: ["version-update:semver-major"]
      # jsdom 25 → 30 要求 Node ^22.22.2 || ^24.15.0 || >=26.0.0，
      # 而 CI（.github/workflows/ci.yml）仍用 Node 20 —— 升上去单测直接跑不起来。
      # 移除本条的前置条件：CI 的 node-version 先升到 22/24。
      - dependency-name: "jsdom"
        update-types: ["version-update:semver-major"]
      # 两端已统一在 eslint 10（此前 buyer=10 / merchant=9，flat config 行为不一致，
      # 同一份 .vue 在两端可能一边过一边挂）。11 及以上的 major 仍需人工评估
      # flat config 的插件兼容性；@eslint/js 与主包版本强绑定，必须一起忽略。
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
    groups:
      npm-merchant-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
      - ci
