server:
  port: 8080
  shutdown: graceful
  tomcat:
    threads:
      # P0-1：与数据库连接池形成合理比例，避免 200 线程抢 50 连接导致全站挂起
      max: 120
      min-spare: 20
    # 连接队列：超出直接排队/拒绝，而不是无限堆积
    accept-count: 200
    max-connections: 8192

spring:
  application:
    name: geek-mall-server
  profiles:
    active: dev
  task:
    scheduling:
      pool:
        # P2-9：默认单线程会让定时任务互相阻塞
        size: 5
  jackson:
    time-zone: GMT+8
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  lifecycle:
    timeout-per-shutdown-phase: 20s

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

mall:
  jwt:
    secret: ${MALL_JWT_SECRET:geek-mall-jwt-secret-key-please-change-in-production-2026}
    expire-minutes: 120
  merchant:
    # 平台费率：与结算单口径一致，改这里即可联动重算
    commission-rate: 0.05
    service-rate: 0.006
    # 提现手续费：按比例计，单笔封顶
    withdraw-fee-rate: 0.001
    withdraw-fee-cap: 500
  sms:
    # 是否在接口响应中回显验证码，仅供开发联调，生产必须为 false
    expose-code: false
  # 集群 / 部署容量：多实例部署必须按实际副本数声明 instance-count
  cluster:
    # 本服务实例数。用于把「进程内」资源分摊到全局：
    #  · 限流 LOCAL 层：每实例额度 = ceil(配置值 / 实例数)（至少 1），避免 N 实例把总量放大 N 倍
    #  · 连接池容量校验：实例数 × 单实例池大小 必须 ≤ mysql-max-connections
    instance-count: 1
    # 与 MySQL max_connections 对齐，启动时用于连接池总量校验
    mysql-max-connections: 300
    capacity-check-enabled: true
  rate-limit:
    # 全站接口限流总开关；规则集中在 common/ratelimit/RateLimitPolicies
    enabled: true
    # 本地限流窗口的容量上限，防止被大量伪造 IP 撑爆内存
    local-max-keys: 200000
  logging:
    # 慢 SQL 阈值（毫秒）：超过才打 WARN，并计入 mall_slow_sql_total 指标。
    # prod 用 NoLoggingImpl 关掉了全量 SQL 日志，这条阈值化通道是生产唯一的慢 SQL 观测入口
    slow-sql-threshold-ms: 200
    # 重复异常日志节流：同一「异常类型 + 崩溃点」在该窗口内只打一次完整堆栈，
    # 其余只记一行摘要 + 累计次数。防止高频异常把日志刷爆、淹没真正有用的错误
    repeat-log-window-seconds: 60
    # 节流指纹的容量上限，防止被构造出大量互不相同的异常撑爆内存
    repeat-log-max-keys: 10000
  cache:
    # ---------------- 缓存治理：穿透 / 击穿 / 雪崩 ----------------
    # TTL 与 L1 白名单全部在此声明，改缓存行为不需要动代码
    default-ttl: 5m
    # 各缓存基础 TTL（实际写入时会叠加 jitter-ratio 的随机浮动）
    ttl:
      homeFloors: 5m
      categoryTree: 30m
      productDetail: 3m
      productRecommend: 5m
    # 【防雪崩】TTL 抖动比例：同一批 key 的失效时刻被打散，避免集中回源
    jitter-ratio: 0.2
    # 【防穿透】空值缓存时长：同一无效 id 只查库一次；取值要短，否则新上架商品会被挡住
    null-ttl: 60s
    # 【防击穿】热点 key 失效时跨实例互斥重建
    lock:
      enabled: true
      # 锁自身 TTL：持锁进程崩溃后自动释放，避免死锁
      ttl: 3s
      # 未抢到锁的线程最长等待时间，超时即放行回源（可用性优先）
      wait-timeout: 800ms
      retry-interval: 50ms
    # 本地一级缓存（L1）：只给能容忍数秒陈旧的聚合类数据
    local:
      enabled: true
      names:
        - homeFloors
        - categoryTree
      ttl: 3s
      max-size: 10000
  # ---------------- 业务级熔断降级（穿透缓存层之外的所有下游依赖） ----------------
  # 缓存层熔断保护的是「Redis ↔ 数据库」；这里是保护「应用 ↔ 外部依赖」，
  # 目标是让某个非核心依赖变慢/不可用时，不要把它无关的业务一起拖垮。
  resilience:
    enabled: true
    # 未单独声明的资源使用以下兜底参数
    defaults:
      # 滑动窗口内样本不足时不做判定，避免低峰期偶发异常把依赖熔断掉
      minimum-calls: 10
      failure-rate-threshold: 50
      # 「慢调用」也算失败：下游不报错但很慢，同样会占满线程池
      slow-call-duration: 3s
      slow-call-rate-threshold: 80
      sliding-window: 60s
      wait-duration-in-open: 10s
      permitted-calls-in-half-open: 3
    resources:
      # 缓存层：Redis 整体不可用时希望尽快熔断，因此最小样本数更低
      cache:
        minimum-calls: 5
        failure-rate-threshold: 60
        slow-call-duration: 3s
        slow-call-rate-threshold: 80
        sliding-window: 30s
        wait-duration-in-open: 10s
        permitted-calls-in-half-open: 2
      # 对象存储：并发上限挡在熔断之前，避免慢上传先占满 Tomcat 线程
      minio-upload:
        minimum-calls: 10
        failure-rate-threshold: 50
        slow-call-duration: 3s
        slow-call-rate-threshold: 60
        sliding-window: 60s
        wait-duration-in-open: 15s
        permitted-calls-in-half-open: 2
        max-concurrent-calls: 20
      # 秒杀削峰队列（Redis Stream）：入队是毫秒级操作，因此慢调用阈值压得很低——
      # 队列一旦变慢，必须在用户等待之前就熔断，并把预扣回补掉
      seckill-queue:
        minimum-calls: 5
        failure-rate-threshold: 50
        slow-call-duration: 200ms
        slow-call-rate-threshold: 50
        sliding-window: 30s
        wait-duration-in-open: 5s
        permitted-calls-in-half-open: 2
        # 并发上限必须 ≥ 峰值并发：200VU 压测时 32 个许可被瞬间抢空，
        # 其余请求在 tryAcquire 处立即失败 → 预扣回补 + 用户看到「系统繁忙」
        # （实测 2 万请求里 104 次被拒，mall_circuit_rejected_total{seckill-queue}=104）。
        # 入队本身是毫秒级 Redis 命令，真正保护线程池的是 Tomcat 的 max-threads，
        # 这里取 256（> Tomcat 200）保证它不会先于 Tomcat 成为「假瓶颈」。
        max-concurrent-calls: 256
  # 秒杀
  seckill:
    async:
      # 削峰模式：Redis Lua 预扣成功后只入队、不等落库，由后台消费者异步建单。
      # 默认关闭 —— 它改变了接口契约（抢购返回「请求号」而非订单号），
      # 前端需配套轮询 /api/v1/seckill/result/{requestId}，默认关闭可保证行为完全不变
      enabled: false
      # 消费者线程数：⚠️ 必须以数据库写能力为上限。开得远超 DB 承载，
      # 只是把雪崩点从 Tomcat 平移到数据库——削峰摊平脉冲，不提升吞吐
      consumer-threads: 4
      batch-size: 16
      # 无消息时的阻塞等待时长
      block: 2s
      # 未确认消息闲置多久后可被回收重投（消费者崩溃兜底），以及扫描间隔
      reclaim-min-idle: 1m
      reclaim-interval: 30s
      # 单条消息最大投递次数：超过即转死信（回补预扣 + 写失败终态 + 丢弃），避免无限重投
      max-deliveries: 3
      # 抢购结果保留时长（前端轮询窗口）
      result-ttl: 30m
      # 消费者名：留空则自动取「主机名 + server.port」，同机多实例 / 多机都不会撞名；
      # 容器编排下若主机名不唯一（如统一 hostname）才需显式配置
      consumer-name: ""
      # 消息流最大长度（近似裁剪），防止 Redis 内存无限增长
      max-stream-length: 100000
  mock:
    # 是否注册联调用的模拟接口（如模拟发货），生产必须为 false
    enabled: false
  storage:
    # minio：对象存储（生产推荐）；local：本地磁盘（不想起 MinIO 时的开发选项）
    type: ${STORAGE_TYPE:minio}
    local-dir: ${STORAGE_LOCAL_DIR:./uploads}
    # 本地存储生成的文件 URL 前缀，需与 server.port 保持一致
    local-public-base-url: ${STORAGE_LOCAL_PUBLIC_URL:http://localhost:8080}
  minio:
    # 对象存储：头像 / 评价图 / 售后凭证
    enabled: true
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:geek-mall}
    # 对外访问前缀，留空则直接用 endpoint 拼接
    public-base-url: ${MINIO_PUBLIC_URL:}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}
